[project]
name = "sasswangpan-backend"
version = "3.0.0"
description = "Mofan FastAPI service on Vercel"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3.2",
    "redis",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "bleach",
    "markdown",
    "pwdlib[argon2]",
    "email-validator",
    "websockets>=14",
    "prometheus-client",
    "boto3",
    "stripe",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
